<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI Studio - PlugIntell</title><link rel="stylesheet" href="/ui/styles.css"></head>
<body><main class="studio-page project-build-page"><header><div><p class="eyebrow">PLUGINTELL</p><h1>AI Studio</h1></div><a class="studio-link studio-nav-button" href="/ui/studio.html">Back to Studio</a></header>
<section class="panel"><form id="suggest-form"><label for="prompt">Describe your RAG workflow</label><textarea id="prompt" rows="5" maxlength="12000" required style="width:100%;box-sizing:border-box" placeholder="Extract PDFs, chunk and embed with Ollama, store in Neo4j and answer questions."></textarea><button id="suggest" type="submit">Suggest plugins</button></form><p id="status" role="status" aria-live="polite"></p><p id="error" class="error" role="alert"></p></section>
<section id="recommendation" class="panel" hidden><p>Based on your prompt, I&#8217;ll use the following plugins.</p><h2 id="ingestion-title">Ingestion</h2><ol id="ingestion"></ol><h2 id="query-title">Query</h2><ol id="query"></ol></section></main>
<dialog id="login-dialog" class="workspace-dialog login-dialog"><form id="login-form"><h2>Sign in</h2><p>Enter your Pipeline Studio account credentials.</p><label>Username<input id="login-username" autocomplete="username" required></label><label>Password<input id="login-password" type="password" autocomplete="current-password" required></label><div id="login-error" class="error" role="alert"></div><button type="submit">Sign in</button></form></dialog>
<script src="/ui/aistudio.js"></script></body></html>
