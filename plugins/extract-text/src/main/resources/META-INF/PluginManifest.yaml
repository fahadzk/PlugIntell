plugin:
  id: extract-text
  name: Text Extractor
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.ExtractTextPlugin
  input:
    type: File
  output:
    type: TextDocument
  capabilities:
    - text-extraction
    - document-processing
  description: Extracts textual content from a UTF-8 text file.
  selection:
    useWhen:
      - Input is a text file.
      - Text extraction is required.
    avoidWhen:
      - OCR or structured table extraction is required.
