plugin:
  id: test-embedder
  name: Deterministic Test Embedder
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.TestEmbedderPlugin
  input:
    type: SegmentCollection
  output:
    type: EmbeddingCollection
  capabilities:
    - deterministic-test-embeddings
  description: Creates small deterministic fake vectors without external services.
  selection:
    useWhen:
      - A repeatable local pipeline demonstration is required.
    avoidWhen:
      - Production semantic embeddings are required.
