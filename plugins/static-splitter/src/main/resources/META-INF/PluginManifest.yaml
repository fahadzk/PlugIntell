plugin:
  id: static-splitter
  name: Static Character Splitter
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.StaticSplitterPlugin
  input:
    type: TextDocument
  output:
    type: SegmentCollection
  capabilities:
    - text-splitting
  description: Splits text into fixed-size character segments.
  selection:
    useWhen:
      - A simple deterministic text split is sufficient.
    avoidWhen:
      - Semantic or sentence-aware segment boundaries are required.
