plugin:
  id: static-splitter
  name: Static Character Splitter
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.StaticSplitterPlugin
  input:
    type: TextDocument
  output:
    type: ChunkCollection
  capabilities:
    - text-splitting
    - parallel-safe
  description: Splits text into fixed-size chunks while preserving document and page metadata.
  selection:
    useWhen:
      - A simple deterministic character split is sufficient.
  configuration:
    properties:
      PLUGIN_STATIC_SPLITTER_CHUNK_SIZE: {type: integer, default: 80, minimum: 1, description: Maximum characters per chunk.}
