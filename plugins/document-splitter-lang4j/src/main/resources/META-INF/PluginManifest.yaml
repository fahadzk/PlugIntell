plugin:
  workflows: [DOCUMENT_INGESTION]
  id: document-splitter
  name: Tika Document Parser and LangChain4j Splitter
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.TikaDocumentSplitterPlugin
  input:
    type: File
  output:
    type: ChunkCollection
  capabilities:
    - messages
    - document-parsing
    - text-extraction
    - document-splitting
  description: Parses supported documents with Apache Tika and returns LangChain4j chunks with document provenance.
  selection:
    useWhen:
      - A document file must be parsed and split in one plugin step.
      - Apache Tika supported formats are required.
    avoidWhen:
      - OCR is required for scanned image-only documents.
  configuration:
    properties:
      PLUGIN_DOCUMENT_SPLITTER_SEGMENT_SIZE: {type: integer, default: 1000, minimum: 1, description: Maximum characters per chunk.}
      PLUGIN_DOCUMENT_SPLITTER_SEGMENT_OVERLAP: {type: integer, default: 100, minimum: 0, description: Overlap characters between chunks.}
