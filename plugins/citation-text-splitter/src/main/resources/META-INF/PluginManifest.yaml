plugin:
  workflows: [DOCUMENT_INGESTION]
  id: citation-text-splitter
  name: Citation-Preserving Text Splitter
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.CitationTextSplitterPlugin
  input:
    type: TextDocument
  output:
    type: ChunkCollection
  capabilities:
    - messages
    - text-splitting
    - page-citations
  description: Splits extracted PDF text into overlapping chunks while retaining source and page metadata.
  selection:
    useWhen:
      - Extracted document text must be split for embedding.
      - Search results must retain page citations.
    avoidWhen:
      - Chunks do not need document provenance.
  configuration:
    properties:
      PLUGIN_TEXT_SPLITTER_CHUNK_SIZE: {type: integer, default: 1000, minimum: 1, description: Maximum characters per chunk.}
      PLUGIN_TEXT_SPLITTER_OVERLAP: {type: integer, default: 120, minimum: 0, description: Overlap characters between chunks.}
