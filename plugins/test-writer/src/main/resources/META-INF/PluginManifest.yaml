plugin:
  id: test-writer
  name: Test Result Writer
  version: 1.0.0
  apiVersion: "1.0"
  entrypoint: com.core.docintel.plugins.TestWriterPlugin
  input:
    type: EmbeddingCollection
  output:
    type: StoredResult
  capabilities:
    - in-memory-result-storage
  description: Counts and retains embedding results in process memory.
  selection:
    useWhen:
      - An in-memory proof-of-concept output is sufficient.
    avoidWhen:
      - Durable storage is required.
